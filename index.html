<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-1: #050816;
      --bg-2: #0b1026;
      --purple: #8b5cf6;
      --blue: #38bdf8;
      --pink: #ec4899;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.65);
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.22), transparent 35%),
        radial-gradient(circle at 80% 30%, rgba(56, 189, 248, 0.18), transparent 35%),
        radial-gradient(circle at 50% 90%, rgba(236, 72, 153, 0.14), transparent 35%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      perspective: 1200px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 45px 45px;
      mask-image: linear-gradient(to bottom, transparent, black 25%, black 80%, transparent);
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(4px);
      opacity: 0.75;
      animation: float 8s ease-in-out infinite;
    }

    .blob.one {
      width: 280px;
      height: 280px;
      left: -80px;
      top: 15%;
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
    }

    .blob.two {
      width: 220px;
      height: 220px;
      right: -40px;
      bottom: 8%;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      animation-delay: -3s;
    }

    .container {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 30px;
      position: relative;
      z-index: 2;
    }

    .scene {
      width: min(1100px, 100%);
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;
      gap: 70px;
      transform-style: preserve-3d;
    }

    .content {
      position: relative;
      z-index: 3;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(14px);
      border-radius: 999px;
      color: rgba(255,255,255,0.75);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 28px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #67e8f9;
      box-shadow: 0 0 18px #67e8f9;
      animation: pulse 1.8s infinite;
    }

    h1 {
      font-size: clamp(4rem, 8vw, 7.5rem);
      line-height: 0.88;
      letter-spacing: -0.07em;
      margin-bottom: 28px;
    }

    h1 span {
      display: block;
      background: linear-gradient(
        90deg,
        #ffffff 10%,
        #c4b5fd 35%,
        #67e8f9 65%,
        #f9a8d4
      );
      -webkit-background-clip: text;
      color: transparent;
      filter: drop-shadow(0 10px 40px rgba(139, 92, 246, 0.25));
    }

    .subtitle {
      max-width: 590px;
      font-size: 18px;
      line-height: 1.8;
      color: var(--muted);
    }

    .visual {
      height: 520px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
    }

    .orb {
      position: absolute;
      width: 300px;
      height: 300px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) translateZ(20px);
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 25%, rgba(255,255,255,0.95), transparent 10%),
        radial-gradient(circle at 38% 35%, #a78bfa, transparent 28%),
        radial-gradient(circle at 65% 70%, #22d3ee, transparent 35%),
        linear-gradient(135deg, #6d28d9, #2563eb 45%, #ec4899);
      box-shadow:
        -30px 35px 100px rgba(124,58,237,0.45),
        35px -20px 100px rgba(34,211,238,0.25),
        inset -30px -30px 80px rgba(0,0,0,0.35),
        inset 20px 20px 45px rgba(255,255,255,0.16);
      animation: orbFloat 6s ease-in-out infinite;
    }

    .orb::after {
      content: "";
      position: absolute;
      inset: 22px;
      border-radius: inherit;
      border: 1px solid rgba(255,255,255,0.16);
    }

    .ring {
      position: absolute;
      width: 410px;
      height: 140px;
      left: 50%;
      top: 50%;
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 50%;
      transform:
        translate(-50%, -50%)
        rotateX(70deg)
        rotateZ(-12deg)
        translateZ(60px);
      box-shadow: 0 0 55px rgba(99,102,241,0.18);
      animation: ringRotate 9s linear infinite;
    }

    .ring::before {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      background: white;
      border-radius: 50%;
      left: 12%;
      top: 12%;
      box-shadow:
        0 0 18px white,
        0 0 35px #67e8f9;
    }

    .glass-card {
      position: absolute;
      padding: 20px 22px;
      min-width: 175px;
      border-radius: 20px;
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.14),
          rgba(255,255,255,0.05)
        );
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(18px);
      box-shadow:
        0 30px 70px rgba(0,0,0,0.25),
        inset 0 1px 0 rgba(255,255,255,0.12);
      transform-style: preserve-3d;
    }

    .card-one {
      top: 70px;
      right: 0;
      transform: rotateY(-17deg) rotateX(7deg) translateZ(80px);
      animation: cardFloat1 5s ease-in-out infinite;
    }

    .card-two {
      left: 0;
      bottom: 75px;
      transform: rotateY(15deg) rotateX(-7deg) translateZ(90px);
      animation: cardFloat2 6s ease-in-out infinite;
    }

    .small-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.13em;
      color: rgba(255,255,255,0.45);
      margin-bottom: 9px;
    }

    .big-number {
      font-size: 28px;
      font-weight: 800;
    }

    .credit {
      position: fixed;
      bottom: 25px;
      width: 100%;
      text-align: center;
      color: rgba(255,255,255,0.25);
      font-size: 12px;
      z-index: 5;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-25px) scale(1.04); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.7); }
    }

    @keyframes orbFloat {
      0%, 100% {
        transform: translate(-50%, -50%) translateY(0) rotate(0deg);
      }
      50% {
        transform: translate(-50%, -50%) translateY(-17px) rotate(3deg);
      }
    }

    @keyframes ringRotate {
      from {
        transform: translate(-50%, -50%) rotateX(70deg) rotateZ(0deg);
      }
      to {
        transform: translate(-50%, -50%) rotateX(70deg) rotateZ(360deg);
      }
    }

    @keyframes cardFloat1 {
      0%, 100% {
        transform: rotateY(-17deg) rotateX(7deg) translateY(0) translateZ(80px);
      }
      50% {
        transform: rotateY(-13deg) rotateX(4deg) translateY(-15px) translateZ(100px);
      }
    }

    @keyframes cardFloat2 {
      0%, 100% {
        transform: rotateY(15deg) rotateX(-7deg) translateY(0) translateZ(90px);
      }
      50% {
        transform: rotateY(11deg) rotateX(-4deg) translateY(16px) translateZ(110px);
      }
    }

    @media (max-width: 900px) {
      body {
        overflow-y: auto;
      }

      .scene {
        grid-template-columns: 1fr;
        text-align: center;
        padding-top: 80px;
      }

      .subtitle {
        margin-left: auto;
        margin-right: auto;
      }

      .visual {
        height: 430px;
      }

      .orb {
        width: 240px;
        height: 240px;
      }

      .ring {
        width: 330px;
      }
    }

    @media (max-width: 550px) {
      h1 {
        font-size: 4.2rem;
      }

      .visual {
        height: 360px;
      }

      .card-one {
        right: 5px;
      }

      .card-two {
        left: 5px;
      }

      .glass-card {
        min-width: 145px;
        padding: 16px;
      }

      .orb {
        width: 200px;
        height: 200px;
      }

      .ring {
        width: 280px;
      }
    }
  </style>
</head>

<body>

  <div class="blob one"></div>
  <div class="blob two"></div>

  <main class="container">
    <section class="scene">

      <div class="content">
        <div class="badge">
          <span class="badge-dot"></span>
          Something amazing is coming
        </div>

        <h1>
          COMING
          <span>SOON.</span>
        </h1>

        <p class="subtitle">
          We're crafting a new digital experience designed to feel different.
          Beautiful, fast, immersive — and almost ready.
        </p>
      </div>

      <div class="visual" id="visual">
        <div class="ring"></div>
        <div class="orb"></div>

        <div class="glass-card card-one">
          <div class="small-label">Launch Status</div>
          <div class="big-number">92%</div>
        </div>

        <div class="glass-card card-two">
          <div class="small-label">Experience</div>
          <div class="big-number">Next Level ✦</div>
        </div>
      </div>

    </section>
  </main>

  <div class="credit">
    © 2026 Your Brand — The future is loading.
  </div>

  <script>
    const visual = document.getElementById("visual");

    document.addEventListener("mousemove", (event) => {
      const x = event.clientX / window.innerWidth - 0.5;
      const y = event.clientY / window.innerHeight - 0.5;

      visual.style.transform = `
        rotateY(${x * 10}deg)
        rotateX(${-y * 10}deg)
      `;
    });

    document.addEventListener("mouseleave", () => {
      visual.style.transform = "rotateY(0deg) rotateX(0deg)";
    });
  </script>

</body>
</html>
